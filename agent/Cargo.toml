[package]
name = "torq-agent"
version = "0.4.0"
edition = "2021"
description = "TorqOS agent (unprivileged, run as a person's agent account, torq-agent-<person>): doctor mode, read-only tools, proposes nothing"
license = "Apache-2.0"

# What the three programs share: the tools, the cleaning, the session (ADR-051 step 5).
[lib]
name = "torq_agent"
path = "src/lib.rs"

[[bin]]
name = "torq-doctor"
path = "src/main.rs"

# A person's agent, resident (ADR-051 3): their conversation, one task at a time, each the harness above.
[[bin]]
name = "torq-agent-service"
path = "src/service/main.rs"

# TorqOS's tools for a coding tool (ADR-051 7): an MCP server on standard input and output, run as the agent.
[[bin]]
name = "torq-mcp"
path = "src/mcp/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
# The API key's header, handed to curl as a private (0600) file: never on a command line.
tempfile = "3"
# A tool program's whole process group stopped at its bounds; a record never written through a link.
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
# The words of the agent service's socket (ADR-044, ADR-051 3), shared with torqcli.
torq-wire = { path = "../wire" }
