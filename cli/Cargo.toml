[package]
name = "torq"
version = "0.1.0"
edition = "2021"
description = "TorqOS command line (unprivileged): changes the system by proposing diffs to torq-broker"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
rustix = { version = "1.1.6", features = ["process", "termios"] }
# buffer-redux: input read past one line (a paste without bracketed paste, keys typed ahead) is
# kept for the next line instead of dropped.
rustyline = { version = "17", default-features = false, features = ["custom-bindings", "buffer-redux"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
