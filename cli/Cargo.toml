[package]
name = "torq"
version = "0.1.0"
edition = "2021"
description = "TorqOS command line (unprivileged): changes the system by proposing diffs to torq-broker"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
libc = "0.2"
rustyline = { version = "17", default-features = false, features = ["custom-bindings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
