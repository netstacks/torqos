# The weekly nixpkgs bump (docs/ROADMAP.md, M2 "CI"): nixpkgs moved to the newest commit of the
# NixOS release TorqOS follows (flake.nix: nixpkgs.url), as a pull request a person merges once the
# tests pass on it. One branch, `bump/nixpkgs`: a week with no merge replaces its bump with the
# newer one. The move to the next NixOS release (every six months) stays a person's.
name: bump

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# The branch and its pull request are pushed and opened with TORQOS_RELEASES_TOKEN (a person's
# token, allowed this repository too): what this workflow's own token pushes or opens starts no
# workflow, and the tests and the sign-off check must run on the bump.
permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  nixpkgs:
    runs-on: ubuntu-latest
    env:
      BRANCH: bump/nixpkgs
      GH_TOKEN: ${{ secrets.TORQOS_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TORQOS_RELEASES_TOKEN }}

      - uses: cachix/install-nix-action@v31

      - name: nix flake update nixpkgs
        id: update
        run: |
          release=$(jq -r .nodes.nixpkgs.original.ref flake.lock)
          old=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          cosmic_old=$(jq -r '.nodes."nixpkgs-cosmic".locked.rev' flake.lock)
          nix flake update nixpkgs
          scripts/bump-cosmic
          new=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          cosmic_new=$(jq -r '.nodes."nixpkgs-cosmic".locked.rev' flake.lock)
          moved=false; { [ "$old" != "$new" ] || [ "$cosmic_old" != "$cosmic_new" ]; } && moved=true
          printf "old=%s\nnew=%s\nrelease=%s\nmoved=%s\n" "$old" "$new" "$release" "$moved" >> "$GITHUB_OUTPUT"
          if [ "$old" = "$new" ]; then echo "nixpkgs is at the newest $release commit already ($new)."; fi

      - name: The bump, on its branch
        if: steps.update.outputs.moved == 'true'
        env:
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
          RELEASE: ${{ steps.update.outputs.release }}
        run: |
          bot="github-actions[bot]"
          email="41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add flake.lock modules/cosmic
          git -c user.name="$bot" -c user.email="$email" commit -q -s -F - <<MSG
          nixpkgs: $RELEASE at ${NEW:0:12}

          From ${OLD:0:12}: https://github.com/NixOS/nixpkgs/compare/$OLD...$NEW
          MSG
          git push -q --force origin "HEAD:refs/heads/$BRANCH"

      - name: Its pull request
        if: steps.update.outputs.moved == 'true'
        env:
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
          RELEASE: ${{ steps.update.outputs.release }}
        run: |
          body="nixpkgs moved to the newest commit of $RELEASE: [${OLD:0:12}...${NEW:0:12}](https://github.com/NixOS/nixpkgs/compare/$OLD...$NEW).

          Merge once its tests pass."
          open=$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')
          if [ -n "$open" ]; then
            gh pr edit "$BRANCH" --title "nixpkgs: $RELEASE at ${NEW:0:12}" --body "$body"
          else
            gh pr create --head "$BRANCH" --base main --title "nixpkgs: $RELEASE at ${NEW:0:12}" --body "$body"
          fi
