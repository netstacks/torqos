# The tests (docs/ROADMAP.md, M2 "CI"): every push to main and every pull request runs what
# `nix flake check` runs here — the packages with their unit tests, the tree checks, the VM tests
# (with KVM) — on x86_64. A pull request's commits must also each be signed off (DCO, CONTRIBUTING.md).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The runner comes with tools TorqOS's builds never use; the VM tests need the room.
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The VM tests run their machines under KVM; the runner has it, for its own group only.
      - name: KVM for the VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: nix flake check
        run: nix flake check -L

  signed-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit carries its author's own `Signed-off-by:` line (git commit -s).
      - name: Every commit signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author=$(git show -s --format='%an <%ae>' "$c")
            if ! git show -s --format=%B "$c" | sed 's/[[:space:]]*$//' | grep -qFx "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$c"): no 'Signed-off-by: $author' (git commit -s; CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
