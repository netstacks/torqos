# The tests (docs/ROADMAP.md, M2 "CI"): what `nix flake check` runs on the dev host — the packages
# with their unit tests, the tree checks, the VM tests (with KVM) — on x86_64. Not on every push:
# during development the full check runs on the dev host before anything merges (docs/DRIVING.md);
# here it runs for pull requests (whose commits must each be signed off, DCO, CONTRIBUTING.md), by
# hand, and as the first step of every release (release.yml).
name: test

on:
  pull_request:
  # By hand: all of it, or one check while looking into it (`gh workflow run test.yml -f check=image`).
  workflow_dispatch:
    inputs:
      check:
        description: "One check (image, trust-loop, …); empty: all of them"
        required: false
        default: ""
  # And as the first step of a release (release.yml).
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going (a run of one check, only one of that check).
concurrency:
  group: test-${{ github.ref }}-${{ inputs.check || 'all' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The runner comes with tools TorqOS's builds never use; the VM tests need the room.
      # The installer's check alone holds the image three times (qcow2, raw, compressed) and an ISO.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null || true
          # Memory: the runner has 8 GB, and evaluating every check takes 12 GB at its peak
          # (measured on torq5, 2026-11-04): the runs that died with "The operation was canceled"
          # had under 100 MB left. Swap on the disk, which has room.
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile-torq && sudo chmod 600 /swapfile-torq
          sudo mkswap -q /swapfile-torq && sudo swapon /swapfile-torq
          df -h /; free -m

      # The VM tests run their machines under KVM; the runner has it, for its own group only.
      - name: KVM for the VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Ubuntu (24.04 on) keeps capabilities from unprivileged user namespaces (AppArmor), which
      # torqcli's filters run in (bubblewrap, with a network namespace of its own): NixOS does not, so
      # the tests run here as on a TorqOS machine.
      - name: User namespaces as on NixOS
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # One derivation at a time: the VM tests each hold several machines in memory, and a runner
      # running two or three of them beside the image build dies with "The operation was canceled"
      # (2026-11-03, twice). Slower, and it finishes. The cores stay all one build's.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 1

      # With what the runner has left, each minute, in the same log (`room:` lines): a run that dies
      # with "The operation was canceled" then says whether the disk or the memory ran out.
      - name: nix flake check
        if: inputs.check == ''
        run: |
          room() {
            while sleep 60; do
              echo "room: $(date -u +%H:%M) disk $(df -h --output=avail / | tail -1) free, memory $(free -m | awk '/Mem/ {print $7}') MB available"
            done
          }
          room &
          nix flake check -L --keep-going

      - name: One check
        if: inputs.check != ''
        env:
          CHECK: ${{ inputs.check }}
        run: nix build -L --no-link ".#checks.x86_64-linux.$CHECK"

  signed-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit carries its author's own `Signed-off-by:` line (git commit -s).
      - name: Every commit signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author=$(git show -s --format='%an <%ae>' "$c")
            if ! git show -s --format=%B "$c" | sed 's/[[:space:]]*$//' | grep -qFx "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$c"): no 'Signed-off-by: $author' (git commit -s; CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
