# The TorqOS images (docs/INSTALL.md), x86_64 and aarch64, each built on a runner of its own
# architecture: the qcow2 (UTM, QEMU, Proxmox), the VMDK (VMware ESXi) and the ISO installer (real
# hardware, ADR-031), kept as the run's artifacts with their checksums. Run by hand (Actions →
# image → Run workflow, or `gh workflow run image.yml`), and as a step of every release
# (release.yml).
name: image

on:
  workflow_dispatch:
  # And by a release (release.yml), on its tag.
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux, runner: ubuntu-latest }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # Memory: the runner has 8 GB, and evaluating every check takes 12 GB at its peak
          # (measured on torq5, 2026-11-04): the runs that died with "The operation was canceled"
          # had under 100 MB left. Swap on the disk, which has room.
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile-torq && sudo chmod 600 /swapfile-torq
          sudo mkswap -q /swapfile-torq && sudo swapon /swapfile-torq
          free -m

      # Ubuntu (24.04 on) keeps capabilities from unprivileged user namespaces (AppArmor), which
      # torqcli's filters run in (bubblewrap, with a network namespace of its own): NixOS does not, so
      # the tests run here as on a TorqOS machine.
      - name: User namespaces as on NixOS
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # NixOS makes the disk in a small VM, a build that asks for `kvm`. The arm64 runner has no KVM:
      # its VM falls back to emulation (QEMU's accel=kvm:tcg), slower but the same disk. The x86_64
      # runner has KVM.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build the images
        run: |
          nix build -L .#packages.${{ matrix.system }}.image --out-link qcow2
          nix build -L .#packages.${{ matrix.system }}.image-vmdk --out-link vmdk
          nix build -L .#packages.${{ matrix.system }}.iso --out-link iso
          mkdir out
          cp -L qcow2/*.qcow2 vmdk/*.vmdk iso/*.iso out/
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: torqos-${{ matrix.system }}
          path: out/
          retention-days: 14
