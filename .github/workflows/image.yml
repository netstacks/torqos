# The TorqOS images (docs/INSTALL.md), x86_64 and aarch64, each built on a runner of its own
# architecture: the qcow2 (UTM, QEMU, Proxmox) and the VMDK (VMware ESXi), kept as the run's
# artifacts with their checksums. Run by hand (Actions → image → Run workflow, or `gh workflow run
# image.yml`). The release workflow, on a tag, comes later (docs/ROADMAP.md, M2 "CI").
name: image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux, runner: ubuntu-latest }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Ubuntu (24.04 on) keeps capabilities from unprivileged user namespaces (AppArmor), which
      # torqcli's filters run in (bubblewrap, with a network namespace of its own): NixOS does not, so
      # the tests run here as on a TorqOS machine.
      - name: User namespaces as on NixOS
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@v31

      - name: Build the images
        run: |
          nix build -L .#packages.${{ matrix.system }}.image --out-link qcow2
          nix build -L .#packages.${{ matrix.system }}.image-vmdk --out-link vmdk
          mkdir out
          cp -L qcow2/*.qcow2 vmdk/*.vmdk out/
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: torqos-${{ matrix.system }}
          path: out/
          retention-days: 14
