# A release (docs/DECISIONS.md, ADR-028), on a `v*` tag pushed here: the tests, the images of
# both architectures, then, only if all of that passed, the release itself in the public
# torqosorg/torqos-releases:
#   - the tagged source as one commit there, signed with the release key, tagged, and `stable`
#     moved to it (never for a pre-release, `v1.2.0-rc1`): what machines update to;
#   - a GitHub Release with the images and the ISO installer (the VMDK gzipped: a release file is at
#     most 2 GiB),
#     SHA256SUMS, its signature, and the key to check it with.
# Secrets: TORQOS_RELEASE_KEY (the release key's private half), TORQOS_RELEASES_TOKEN (a person's
# token for torqosorg/torqos-releases, allowed this repository too for the weekly bump: ADR-028).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag is the version the source says (cli/Cargo.toml, set by scripts/bump-version), or a
  # pre-release of it (v0.2.0-rc1): a machine reports that version, so a tag that differs would
  # publish machines saying something else. First, before an hour of tests.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the source's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          src=$(awk '/^\[/{p = ($0 == "[package]")} p && /^version *=/ {gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit}' cli/Cargo.toml)
          broker=$(awk '/^\[/{p = ($0 == "[package]")} p && /^version *=/ {gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit}' broker/Cargo.toml)
          # vX.Y.Z is a release; vX.Y.Z-<word> (rc1, beta.2) a pre-release; nothing else is a tag here.
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is neither a release (v1.2.3) nor a pre-release (v1.2.3-rc1)"; exit 1
          fi
          want="${TAG#v}"; want="${want%%-*}"
          if [ "$src" != "$want" ] || [ "$broker" != "$want" ]; then
            echo "::error::$TAG is not this source's version (cli $src, broker $broker): run scripts/bump-version $want, commit, and tag that commit"
            exit 1
          fi
          echo "$TAG: TorqOS $src"

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  image:
    needs: version
    uses: ./.github/workflows/image.yml

  publish:
    needs: [test, image]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: torqos-*
          merge-multiple: true
          path: files

      - name: The release key
        env:
          KEY: ${{ secrets.TORQOS_RELEASE_KEY }}
        run: |
          (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/release-key")
          # The key the machines check with is the one this signs with.
          test "$(ssh-keygen -y -f "$RUNNER_TEMP/release-key" | cut -d' ' -f1,2)" = "$(cut -d' ' -f3,4 release/allowed_signers)"

      - name: Checksums, signed
        run: |
          cd files
          for f in *.vmdk; do gzip -9n "$f"; done
          # A release file is at most 2 GiB (GitHub): said here, by name, not as a failed upload. The
          # ISO (about 1.9 GiB, ADR-031) is the one near it.
          for f in *; do s=$(stat -c %s "$f"); if [ "$s" -ge 2147483648 ]; then echo "::error::$f is $s bytes: a release file is at most 2 GiB"; exit 1; fi; done
          rm -f SHA256SUMS
          sha256sum *.qcow2 *.vmdk.gz *.iso > SHA256SUMS
          ssh-keygen -Y sign -q -f "$RUNNER_TEMP/release-key" -n file SHA256SUMS
          cp ../release/allowed_signers .
          ssh-keygen -Y verify -f allowed_signers -I torqos-release -n file -s SHA256SUMS.sig < SHA256SUMS
          cat SHA256SUMS

      - name: The source, signed, in the releases
        env:
          TOKEN: ${{ secrets.TORQOS_RELEASES_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${TOKEN}@github.com/torqosorg/torqos-releases.git" "$RUNNER_TEMP/releases"
          cd "$RUNNER_TEMP/releases"
          # What was tested is what is signed: the tag still names the commit this run tested.
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" \
            || { echo "::error::$TAG was moved after this run began: tag the tested commit again"; exit 1; }
          # A release moves `stable` only up, by version, not by git (audit A3): never to an older
          # release or one machines already have. Checked before anything is published.
          new="${TAG#v}"
          case "$TAG" in
            *-*) ;;
            *)
              if git fetch -q origin stable 2>/dev/null; then
                old=$(git show FETCH_HEAD:cli/Cargo.toml | awk '/^\[/{p = ($0 == "[package]")} p && /^version *=/ {gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit}')
                if [ -n "$old" ] && { [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ] || [ "$old" = "$new" ]; }; then
                  echo "::error::stable is TorqOS $old: $TAG is not newer, so it would move machines back (publish it as a pre-release, $TAG-1, if it must be out)"; exit 1
                fi
              fi ;;
          esac
          git rm -rq --ignore-unmatch .
          # The tagged source, without this repository's workflows (they are for building, here).
          git -C "$GITHUB_WORKSPACE" archive "$GITHUB_SHA" | tar -x --exclude=.github
          git add -A
          sign=(-c user.name="TorqOS release" -c user.email="release@torqos.invalid" -c gpg.format=ssh -c user.signingkey="$RUNNER_TEMP/release-key")
          git "${sign[@]}" commit -q -S -m "TorqOS $TAG"
          git "${sign[@]}" tag -s "$TAG" -m "TorqOS $TAG"
          git -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/release/allowed_signers" -c gpg.format=ssh verify-commit HEAD
          git push -q origin HEAD:main "refs/tags/$TAG"
          # `stable` only moves forward (no force), and only to a newer version (checked above).
          case "$TAG" in
            *-*) echo "$TAG is a pre-release: stable stays where it is" ;;
            *) git push -q origin HEAD:stable ;;
          esac

      - name: The GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TORQOS_RELEASES_TOKEN }}
        run: |
          fingerprint=$(ssh-keygen -lf <(cut -d' ' -f3,4 release/allowed_signers) | cut -d' ' -f2)
          # The source statement (ADR-039): flake.lock pins every input, so the tag and the commits
          # it names are the source of every package in the images. nixpkgs is the root's input of
          # that name, whatever the lock calls its node.
          nixpkgs=$(jq -er '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          TorqOS $TAG.

          **Images** (how to run them: docs/INSTALL.md, "Running it"):
          - \`torqos-<arch>.qcow2\`: UTM, QEMU, Proxmox, as it is.
          - \`torqos-<arch>.vmdk.gz\`: VMware ESXi; \`gunzip\` it first.
          - \`torqos-<arch>.iso\`: the installer, for a real machine's disk: write it to a USB stick as it is (docs/INSTALL.md).

          **Check a download** (OpenSSH, nothing to install):
          \`\`\`
          ssh-keygen -Y verify -f allowed_signers -I torqos-release -n file -s SHA256SUMS.sig < SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`
          The release key: \`$fingerprint\`.

          **Machines already installed:** \`request system update\` moves them here; each checks the
          release was signed with the key it was installed with.

          **Source.** These images are built from the tag \`$TAG\` of
          [torqosorg/torqos-releases](https://github.com/torqosorg/torqos-releases/tree/$TAG), with
          nixpkgs at commit [\`$nixpkgs\`](https://github.com/NixOS/nixpkgs/tree/$nixpkgs) and every
          other input at the commit its \`flake.lock\` pins. Every package's source, the GPL'd ones
          among them (the kernel, git, bash, coreutils and the rest), is pinned there by hash, in
          nixpkgs. \`nix --extra-experimental-features 'nix-command flakes' build "git+https://github.com/torqosorg/torqos-releases?ref=refs/tags/$TAG#image"\`
          builds the same system from the same sources (\`#image-vmdk\`, \`#iso\` the others); not the
          same bytes, since an image carries its own copy of its source, and the releases'
          copy has no CI files. TorqOS is a NixOS derivative, not NixOS (docs/DECISIONS.md, ADR-029).
          EOF
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" -R torqosorg/torqos-releases "${pre[@]}" --verify-tag \
            --title "TorqOS $TAG" --notes-file "$RUNNER_TEMP/notes.md" files/*

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key"
