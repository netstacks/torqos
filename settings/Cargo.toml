[package]
name = "torq-settings"
version = "0.3.2"
edition = "2024"
description = "TorqOS Settings: torqcli in a COSMIC window, TorqOS in its panel, SSH tunnels, and the person's agent (ADR-045 2, ADR-049, ADR-050, ADR-051 4)"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
# The command line's own calls and words (cli/src/app.rs): what the window shows is what torqcli prints.
torq = { path = "../cli" }
# COSMIC's notifications, from the panel's applet (ADR-049 4).
zbus = "5"

# COSMIC's toolkit, at the revision COSMIC's own Settings 1.11.0 uses (the desktop's, ADR-045 amended).
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "430f3d48a97d8779f9c1985473912e594ccca1ae"
default-features = false
# applet-token: the agent's applet raises its window (an activation token); single-instance: one agent window a person.
features = ["winit", "tokio", "dbus-config", "multi-window", "applet", "applet-token", "single-instance"]

# The window, and TorqOS in COSMIC's panel (ADR-049).
[[bin]]
name = "torq-settings"
path = "src/main.rs"

[[bin]]
name = "torq-applet"
path = "src/applet.rs"

# The person's SSH tunnels (ADR-050): what their unit runs, and the panel applet.
[[bin]]
name = "torq-tunnel"
path = "src/tunnel.rs"

[[bin]]
name = "torq-tunnels"
path = "src/tunnels.rs"

# The person's agent (ADR-051 4): its panel applet, beside TorqOS's, and its window.
[[bin]]
name = "torq-agent-applet"
path = "src/agent_applet.rs"

[[bin]]
name = "torq-agent-ui"
path = "src/agent_ui.rs"

# A crash of the person's, offered to their agent when they say so (ADR-051 4, step 4): their own user service.
[[bin]]
name = "torq-crash-watch"
path = "src/crash_watch.rs"
