[package]
name = "kestrel-broker"
version = "0.1.0"
edition = "2021"
rust-version = "1.89" # std::fs::File::try_lock
description = "Kestrel privileged change broker: tiers, signed commits, rebuild, rollback, hash-chained ledger"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
