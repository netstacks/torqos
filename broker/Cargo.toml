[package]
name = "torq-broker"
version = "0.4.0"
edition = "2021"
rust-version = "1.89" # std::fs::File::try_lock
description = "TorqOS privileged change broker: tiers, commits, rebuild, rollback, hash-chained ledger"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
nonstick = "0.1.2"
rustix = { version = "1.1.6", features = ["process", "fs", "net", "event"] }
# SO_PEERPIDFD (the peer's pidfd, ADR-051 step 5): rustix has no safe call for it, and unsafe is forbidden
# (ADR-020). Only its `socket` feature.
nix = { version = "0.30.1", default-features = false, features = ["socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
torq-wire = { path = "../wire" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
